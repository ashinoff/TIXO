name: Catalog and Amvera build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_DB: tixo_test
          POSTGRES_USER: tixo_test
          POSTGRES_PASSWORD: tixo_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tixo_test -d tixo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:catalog
        env:
          TEST_DATABASE_URL: postgresql://tixo_test:tixo_test_ci@localhost:5432/tixo_test
      - run: npm run lint
      - run: npm run test:ui
      - run: node --test tests/costing-ui.test.mjs
      - run: npm run build:amvera
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm run test:http
        env:
          NODE_ENV: production
          TEST_DATABASE_URL: postgresql://tixo_test:tixo_test_ci@localhost:5432/tixo_test
      - run: node --test tests/costing-http.test.mjs
        env:
          NODE_ENV: production
          TEST_DATABASE_URL: postgresql://tixo_test:tixo_test_ci@localhost:5432/tixo_test

  publication:
    name: Confirm admin on Amvera (read-only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-costing-publication.mjs
